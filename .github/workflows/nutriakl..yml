name: CI/CD for Nutriakl

on:
  push:
    branches:
      - main   # Trigger on pushes to the 'main' branch
  pull_request:
    branches:
      - main   # Trigger on pull requests targeting 'main'

jobs:
  lint-and-build:
    name: Lint, Build, and Deploy
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Use the Node.js version compatible with your Nuxt app
          cache: 'npm'      # Cache `npm` dependencies for faster builds

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Lint code
      - name: Run Linter
        run: npm run lint

      # Run Tests (Optional)
      - name: Run Tests
        run: npm test

      # Build the Nuxt application
      - name: Build Nuxt.js
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-build  # Wait for the lint-and-build job to complete

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel --prod --token $VERCEL_TOKEN
